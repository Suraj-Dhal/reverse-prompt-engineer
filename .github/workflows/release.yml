name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

env:
  PYTHONUTF8: "1"

jobs:
  release:
    name: Build and publish ${{ github.ref_name }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Tag must match the manifest version
        run: |
          version="$(python -c "import json; print(json.load(open('plugin.json'))['version'])")"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match plugin.json version ${version}"
            exit 1
          fi

      - name: Validate and test
        run: |
          python -m pip install --disable-pip-version-check jsonschema
          python scripts/validate.py
          python -m unittest discover -s tests

      - name: Build archives
        run: python scripts/package.py

      - name: Release notes from CHANGELOG
        run: python scripts/release_notes.py "${GITHUB_REF_NAME}" > release-notes.md

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" > /dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" dist/* --clobber
            gh release edit "${GITHUB_REF_NAME}" --notes-file release-notes.md
          else
            gh release create "${GITHUB_REF_NAME}" dist/* \
              --title "Reverse Prompt Engineer ${GITHUB_REF_NAME}" \
              --notes-file release-notes.md \
              --verify-tag
          fi
